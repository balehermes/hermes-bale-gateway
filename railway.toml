[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Persistent volume for Hermes state, wallet keys, and session history.
[[mounts]]
source = "hermes-data"
destination = "/data"
