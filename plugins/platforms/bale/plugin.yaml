name: bale-platform
label: Bale Messenger
kind: platform
version: 1.0.0
description: >
  Bale Messenger gateway adapter for Hermes Agent.

  Replaces the default Telegram adapter. Connects to Bale via the Bale Bot
  API (https://tapi.bale.ai/bot<TOKEN>/...) using either long polling or a
  webhook. The Bale Bot API is structurally compatible with the Telegram
  Bot API, so this plugin keeps the same `MessageEvent` shape used by the
  Hermes gateway runner.

  Features:
    * Long polling and optional webhook (BALE_WEBHOOK_URL)
    * DoH-based fallback IP discovery (mirrors the Telegram plugin's
      network hardening) so wedged DNS / blackholed IPv6 paths can't pin
      the gateway's init loop.
    * Per-user allowlist (BALE_ALLOWED_USERS) and global override
      (BALE_ALLOW_ALL_USERS) — defaults to deny-all in production.
    * HTML parse mode only (Bale does not support Telegram's MarkdownV2
      quirks; HTML is rendered consistently).
    * Inline keyboards and callback queries identical to Telegram.
    * Photo/document/video downloads through Bale's /file/bot<TOKEN>/<path>
      endpoint.

author: balehermes
requires_env:
  - name: BALE_BOT_TOKEN
    description: "Bale bot token from @BotFather on Bale Messenger"
    prompt: "Bale bot token"
    url: "https://bale.ai/BotFather"
    password: true
optional_env:
  - name: BALE_ALLOWED_USERS
    description: "Comma-separated Bale user IDs allowed to talk to the bot"
    prompt: "Allowed user IDs (comma-separated)"
    password: false
  - name: BALE_ALLOW_ALL_USERS
    description: "Allow any Bale user to trigger the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: BALE_HOME_CHANNEL
    description: "Default chat ID for cron / notification delivery"
    prompt: "Home channel ID"
    password: false
  - name: BALE_HOME_CHANNEL_NAME
    description: "Display name for the Bale home channel"
    prompt: "Home channel display name"
    password: false
  - name: BALE_API_BASE_URL
    description: "Override the Bale Bot API base URL (default https://tapi.bale.ai)"
    prompt: "API base URL"
    password: false
  - name: BALE_POLLING_TIMEOUT
    description: "Long-poll timeout in seconds (default 30)"
    prompt: "Polling timeout"
    password: false
  - name: BALE_POLLING_INTERVAL
    description: "Sleep between failed polls in seconds (default 1.0)"
    prompt: "Polling interval"
    password: false
  - name: BALE_WEBHOOK_URL
    description: "Public URL Bale will POST updates to. Leave empty to use long polling."
    prompt: "Webhook URL"
    password: false
  - name: BALE_WEBHOOK_SECRET
    description: "Shared secret sent in X-Bale-Secret header; reject updates without a match."
    prompt: "Webhook secret"
    password: true